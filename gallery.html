<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery | Nature's Notes by Obaydul</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
            background:#f5f5f5;
        }

        h1{
            text-align:center;
            margin-top:40px;
            font-size:38px;
            color:#2e7d32;
        }

        p{
            text-align:center;
            color:#555;
            margin:15px 0 30px;
            font-size:18px;
        }

        .gallery{
            width:95%;
            max-width:1200px;
            margin:auto;
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
            gap:20px;
            padding-bottom:40px;
        }

        .gallery img{
            width:100%;
            height:300px;
            object-fit:cover;
            border-radius:12px;
            box-shadow:0 5px 15px rgba(0,0,0,.2);
            transition:0.3s;
            cursor:pointer;
        }

        .gallery img:hover{
            transform:scale(1.05);
        }
    </style>
</head>

<body>

<h1>Welcome to my nature photography gallery </h1>

<p>some moments captured by my camera</p>

<div class="gallery">

    <img src="nature1.jpg" alt="nature Photo 1">

    <img src="nature2.jpg" alt="nature Photo 2">

</div>

</body>
</html>
