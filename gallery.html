<!DOCTYPE html>
<html lang="en">
<head>
    <style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

h1 {
    text-align: center;
    margin-top: 30px;
}

p {
    text-align: center;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    padding: 20px;
}

.gallery img {
    width: 100%;
    height: 250px;
    object-fit: cover;
    border-radius: 12px;
}
</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery | Nature's Notes by Obaydul</title>
</head>
<body>

    <h1>Some Moments Captured by My Camera</h1>

    <p>Welcome to my nature photography gallery.</p>
<div class="gallery">
    <img src="nature2.jpg" alt="Nature 2">
    <img src="nature3.jpg" alt="Nature 3">
</div>
</body>
</html>
